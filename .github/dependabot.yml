# Automated dependency updates.
#
# Action versions here are pinned, which is deliberate -- a mutable tag is a
# promise that an account you do not control stays uncompromised. The cost of
# pinning is that nothing updates itself, so this is the other half of it:
# dependabot proposes the bump, CI proves it, you merge it.
#
# Grouped and monthly, so this stays a few reviewable PRs rather than a swarm.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      build:
        patterns: ["vite", "@vitejs/*", "eslint*", "@eslint/*", "globals", "typescript", "playwright*"]
      runtime:
        patterns: ["react", "react-dom", "marked", "gh-pages"]
    # Held on eslint 9.x ON PURPOSE. eslint-plugin-react caps its peer range at
    # `^9.7` and 7.37.5 is the newest release that exists, so there is no
    # version of it that tolerates eslint 10 -- `npm ci` fails ERESOLVE before
    # the lint step even runs. Without this, dependabot proposes the same
    # unmergeable bump every month. Drop both entries once eslint-plugin-react
    # ships an eslint 10 peer range.
    ignore:
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
