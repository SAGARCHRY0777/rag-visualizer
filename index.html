    <script>
      // Applied before first paint so the page never flashes the default theme.
      (function () {
        try {
          var saved = localStorage.getItem('rag-visualizer:theme')
          var ok = ['midnight', 'slate', 'ember', 'daylight', 'paper']
          if (ok.indexOf(saved) === -1) {
            saved = matchMedia('(prefers-color-scheme: light)').matches ? 'daylight' : 'midnight'
          }
          document.documentElement.setAttribute('data-theme', saved)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'midnight')
        }
      })()
    </script>
